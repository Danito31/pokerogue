/* ---------- relations (bible §14) ---------- */
const PK=['Altruiste','Ambitieux','Calculateur','Impulsif','Stoïque','Curieux','Gourmand','Égoïste','Opportuniste'];
/* table de compatibilité (dérive par période passée ensemble ; symétrique) */
const CT=[
/*        Alt  Amb  Cal  Imp  Sto  Cur  Gou  Ego  Opp */
/*Alt*/ [ .6, .3, .2, .2, .3, .5, .5,-1.2, .6],
/*Amb*/ [ .3,-.2, .1,-.1, .1, .3, .2, -.6, .5],
/*Cal*/ [ .2, .1, .1,-.4, .3, .3, .1, -.3, .4],
/*Imp*/ [ .2,-.1,-.4,-.3, 0 , .3, .3, -.7, .5],
/*Sto*/ [ .3, .1, .3, 0 , .2, .2, .2, -.2, .3],
/*Cur*/ [ .5, .3, .3, .3, .2, .6, .6, -.3, .6],
/*Gou*/ [ .5, .2, .1, .3, .2, .6, .8, -.5, .6],
/*Ego*/ [-1.2,-.6,-.3,-.7,-.2,-.3,-.5,-.8, .1],
/*Opp*/ [ .6, .5, .4, .5, .3, .6, .6, .1, .4]];
const soc=c=>(c.subs||[]).reduce((a,s)=>a+(TRAITS[s]?TRAITS[s][2]:0),0);
function compat(a,b){const i=PK.indexOf(a.pers),j=PK.indexOf(b.pers);const base=i<0||j<0?0:CT[i][j],ch=((((a.seed||1)*31+(b.seed||1)*17)%100)/100-.5)*.3;return base+soc(a)+soc(b)+ch}
const rk=(a,b)=>a.id<b.id?a.id+'_'+b.id:b.id+'_'+a.id;
function rel(a,b){if(!G.rel)G.rel={};const k=rk(a,b);let r=G.rel[k];if(!r)r=G.rel[k]={v:Math.round(clamp(compat(a,b)*10+rnd(-5,5),-20,20)+(a.tal=='charisme'||b.tal=='charisme'?10:0)),tt:0};return r}
const amb=c=>c.pers=='Ambitieux'||(c.subs||[]).some(s=>s=='Compétitif'||s=='Orgueilleux');
function drift(a,b,k){const r=rel(a,b);let d=compat(a,b)*k;if(a.tal=='charisme'||b.tal=='charisme')d*=d>0?2:.5;if(d<0&&(a.pers=='Stoïque'||b.pers=='Stoïque')&&r.v<=-20)d=0;if(d<0&&(a.pers=='Opportuniste'||b.pers=='Opportuniste')&&a.pers!='Égoïste'&&b.pers!='Égoïste'&&r.v<=-10)d=0;
 r.v=+clamp(r.v+d,-100,100).toFixed(2);r.tt=+(r.tt+Math.abs(k)).toFixed(2);if(!r.rv&&amb(a)&&amb(b)&&r.tt>=6)r.rv=1;return r}
/* état d'une paire : harcèlement (égoïste → altruiste), hostilité, rivalité, amitié, respect, neutre */
function relState(a,b){const r=rel(a,b),v=r.v;
 if(v<=-25&&((a.pers=='Égoïste'&&b.pers=='Altruiste')||(b.pers=='Égoïste'&&a.pers=='Altruiste')))return{k:'harcele',by:a.pers=='Égoïste'?a:b,v};
 if(r.rv&&v>-40)return{k:'rival',v};if(v<=-40)return{k:'hostile',v};if(v>=40)return{k:'ami',v};
 if(v>=15&&['Calculateur','Stoïque'].some(p=>a.pers==p||b.pers==p))return{k:'respect',v};return{k:'neutre',v}}
const RELN={ami:['♥','Ami','#ff8fb3'],rival:['⚔','Rival','#ffcf4a'],harcele:['⚠','Harcèlement','#ff5a5a'],hostile:['✖','Hostile','#ff5a5a'],respect:['◆','Respect','#4de0c0'],neutre:['·','Neutre','#a9a4d0']};
const others=c=>G.chars.filter(o=>o!=c);
function isoOf(c){const os=others(c);if(os.length<2)return false;let s=0,f=0;os.forEach(o=>{const st=relState(c,o);s+=st.v;if(st.k=='ami')f++});return !f&&s/os.length<-15}
const bullied=c=>c.pers=='Altruiste'&&others(c).some(o=>relState(c,o).k=='harcele');
/* moral en combat : amis +4 %, hostiles −4 %, rival +2 % (stimulant), harcelé −10 % si le harceleur est là (−4 % sinon), isolé −8 % en groupe */
function moraleOf(c,team){let m=0;team.forEach(o=>{if(o==c)return;const s=relState(c,o);if(s.k=='ami')m+=.04;else if(s.k=='hostile')m-=.04;else if(s.k=='rival')m+=.02;else if(s.k=='harcele'&&s.by!=c)m-=.10});if(bullied(c)&&!team.some(o=>o!=c&&relState(c,o).k=='harcele'))m-=.04;if(isoOf(c)&&team.length>=3)m-=.08;return clamp(m,-.2,.15)}
function relTick(list,k){for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++)drift(list[i],list[j],k)}
function relBattle(list,win){relTick(list,1.5);if(win)for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++){const r=rel(list[i],list[j]);if(compat(list[i],list[j])>-.4)r.v=Math.min(100,+(r.v+.5).toFixed(2))}}
function relPrune(){if(!G.rel)G.rel={};const ids=new Set(G.chars.map(c=>c.id));for(const k in G.rel){const[a,b]=k.split('_').map(Number);if(!ids.has(a)||!ids.has(b)||!G.rel[k]||typeof G.rel[k].v!='number')delete G.rel[k]}}
function relSeed(){G.chars.forEach((a,i)=>G.chars.slice(i+1).forEach(b=>{const r=rel(a,b);if(!r.tt&&a.party&&b.party){r.tt=4;r.v=+clamp(r.v+compat(a,b)*6,-100,100).toFixed(2)}}))}
function relIcons(c){const cnt={};others(c).forEach(o=>{const k=relState(c,o).k;if(k!='neutre')cnt[k]=(cnt[k]||0)+1});let h=Object.keys(cnt).map(k=>`<span class="rli" style="color:${RELN[k][2]}" title="${RELN[k][1]} ×${cnt[k]}">${RELN[k][0]}${cnt[k]}</span>`).join('');if(bullied(c))h+='<span class="rli" style="color:#ff5a5a" title="Harcelé : moral en baisse">☹</span>';if(isoOf(c))h+='<span class="rli" style="color:#a9a4d0" title="Isolé">◌ isolé</span>';return h}

function relLine(a,b){if(isoOf(a)&&Math.random()<.4)return pick(RLN.iso);if(!b)return pick(LN[a.pers]||['…']);const s=relState(a,b);let L;

/* ---------- butin : rangs des ingrédients d'évolution selon la profondeur ----------

const TU=[1,1,3,8,15,25],TB=[100,30,8,2,.25,.03];
function tierW(f,boss){const fe=f+(boss?10:0),m=1+fe/20;return TB.map((b,i)=>fe>=TU[i]?b*Math.pow(m,i):0)}
function tierAt(f,boss){const w=tierW(f,boss);let x=Math.random()*w.reduce((a,b)=>a+b,0);for(let i=0;i<6;i++){x-=w[i];if(x<0)return i+1}return 1}

function fightDrops(cfg,f,bi){const o={},big=d=>d.kind=='elite'||d.kind=='mini'||d.kind=='boss',defs=(cfg.defs||[]).concat(...(cfg.waves||[]));
 shuffle(defs).slice(0,4).forEach(d=>{const L=MDROP[d.type];if(L&&Math.random()<(big(d)?.8:.4))madd(o,pick(L),1+(big(d)?1:0)+(Math.random()<f/40?1:0))});
 if(defs.some(d=>d.kind=='elite')&&Math.random()<.2)madd(o,'mat_noyau',1);
 if(Math.random()<(cfg.kind=='norm'?.3:.5))madd(o,'mat_essence_'+pick(bi.el),1+Math.floor(f/12));
 if(Math.random()<.15)madd(o,bi.res=='wood'?'mat_bois':'mat_minerai',1);return o}

 else if(kind=='mini'){madd(o,evoDrop(f,'parchemin'),1);madd(o,evoDrop(f,pick(['pierre','tome'])),1);if(Math.random()<.5)madd(o,'mat_noyau',1)}
 else if(Math.random()<.35)madd(o,evoDrop(f),1);if(pact)for(const k in o)o[k]*=2;return o}

 const s1=stats(c);lines.unshift(`Niveau maximal <b>${cap0}</b> → <b class="g">${cap(c)}</b>`,`PV ${s0.hp} → <b class="g">${s1.hp}</b> · ATQ ${s0.atk} → <b class="g">${s1.atk}</b> · DEF ${s0.def} → <b class="g">${s1.def}</b>`);
 save();syncNPC();rp();evoReveal({img:cs(c).url,col:ELEMS[c.elem].c,title:c.tr&&st0==6?'TRANSCENDANCE !':'ÉVEIL !',name:c.name,from:st0==6?6:st0,to:c.st,tr:c.tr||0,trNew:st0==6,lines})}

const CRW=[null,[60,30,9,1,0,0],[45,35,15,4,1,0],[32,38,21,7.5,1.4,.1]];

function crOdds(L,b){L=clamp(L==null?bl('forge'):L,1,3);b=b==null?(CRO.p?1:0)+(CRO.n?2:0):b;const k=1+.2*b,w=CRW[L].map((v,i)=>v*Math.pow(k,i)),t=w.reduce((a,v)=>a+v,0);return w.map(v=>v/t)}

function upB(i){const pl=G.plots[i],b=BLD[pl.k],o={wood:b.c[0]*(pl.lv+1),stone:b.c[1]*(pl.lv+1)};if(pl.lv>=3||!can(o))return;pay(o);pl.lv++;villageLabels();save();rp();toast(b.n+' : niveau '+pl.lv)}
function openB(i){openPanel(()=>{const pl=G.plots[i],k=pl.k,b=BLD[k],o={wood:b.c[0]*(pl.lv+1),stone:b.c[1]*(pl.lv+1)};
 let h=`<div class="bh"><div class="bill"><img src="${bUi(k,pl.lv)}" alt=""></div><div class="bi">${stars(pl.lv,3,1)}<div class="bl">Niveau ${pl.lv} / 3</div><p class="m">${b.d}</p>${effH(k,pl.lv)}${pl.lv<3?`<div class="up">${costH(o)}<button class="ib" ${can(o)?'':'disabled'} onclick="upB(${i})">Améliorer → niv. ${pl.lv+1}</button></div>`:'<div class="up g">Niveau maximal atteint</div>'}</div></div><div class="dv"></div><p class="resl">${['food','wood','stone','gold','shard'].map(chip).join(' ')}</p>`;
 if(k=='auberge')h+=tabsH(ATAB,[['inv','Invocation','res_gold'],['autel','Autel d’éveil','ui_evolution']],'setAT')+(ATAB=='autel'?autelHTML():`<p>Places : <b>${G.chars.length} / ${capa()}</b> · une invocation coûte 50 or.</p><p class="m">Taux : matériaux 39,39 % (dont 13,13 % d’équipement ; le reste en ingrédients : matériaux de forge, parfois un parchemin, une pierre ou un tome) · 1★ 50 % · 2★ 9 % · 3★ 1 % · 4★ 0,5 % · 5★ 0,1 % · 6★ 0,01 %. Un mage apparaît une fois sur cent. Les invoqués arrivent souvent équipés ; leur classe dépend de leur arme.</p>${hasTal('gacha')?`<p class="g">✦ Gacha béni : chances de 3★ et plus ×1,5 · pitié <b>${G.pity||0} / 30</b> (3★ garanti à 30).</p>`:''}${hasTal('oeil')?`<p class="m" style="color:var(--teal)">◉ Œil du joueur : 3★ ou plus par invocation <b>${(1.61*(hasTal('gacha')?1.5:1)).toFixed(3).replace('.',',')} %</b> · au moins un en ×10 : <b>${(100*(1-Math.pow(1-.0161*(hasTal('gacha')?1.5:1),10))).toFixed(2).replace('.',',')} %</b>.</p>`:''}<button class="ib hot" onclick="summon(1)" ${G.res.gold<50?'disabled':''}>Invoquer ×1</button> <button class="ib hot" onclick="summon(10)" ${G.res.gold<500?'disabled':''}>Invoquer ×10</button>`+pullHTML());
 if(k=='ferme')h+=`<p>Récolte prête : <b>${pl.stock|0}</b> vivres (réserve max. ${60*pl.lv}).</p><button class="ib" onclick="G.res.food+=G.plots[${i}].stock|0;G.plots[${i}].stock=0;save();rp()">Récolter</button>`;
 if(k=='camp'){const c0=Math.max(10,28-6*pl.lv);h+=`<p class="m">Une séance coûte ${c0} vivres et rapporte ${40+20*pl.lv} points d’expérience.</p>`+G.chars.filter(c=>!c.inj).map(c=>`<div class="row"><img class="sp" src="${cs(c).url}" alt=""><div class="gr"><b>${c.name}</b> ${stars(c.st)} <span class="m">niv. ${c.lv}/${cap(c)} · exp. ${c.xp}/${need(c)}</span></div><button class="ib" ${G.res.food<c0||c.lv>=cap(c)?'disabled':''} onclick="train(${c.id},${c0},${40+20*pl.lv})">Entraîner</button></div>`).join('')}

function train(id,c0,xp){const c=G.chars.find(x=>x.id==id);if(G.res.food<c0)return;G.res.food-=c0;if(gain(c,xp)){const t=newSkTxt();toast(c.name+' passe au niveau '+c.lv+' !'+(t?'<br>'+t:''),t?4200:2600)}save();rp()}
function healC(id,c0){const c=G.chars.find(x=>x.id==id);if(G.res.food<c0)return;G.res.food-=c0;c.inj=0;save();syncNPC();rp()}
function forge(id){const c=G.chars.find(x=>x.id==id),it=c&&c.eq.arme;if(!it)return;const w=it.lv||0,o={stone:30*(w+1),gold:40*(w+1)};if(!can(o))return;pay(o);it.lv=w+1;save();rp()}

/* table de la bible : matériaux 39,39 % (dont un tiers devient un objet d'équipement), 1★ 50 %, 2★ 9 %, 3★ 1 %, 4★ 0,5 %, 5★ 0,1 %, 6★ 0,01 % */
function roll(){const g=hasTal('gacha')?1.5:1,x=Math.random()*100;let a=39.39;if(x<a)return 0;for(const[s,p]of[[1,50-1.61*(g-1)],[2,9],[3,g],[4,.5*g],[5,.1*g],[6,.01*g]]){a+=p;if(x<a)return s}return 1}
const ITEM_SHARE=13.13/39.39;
function summon(n){SM=[];for(let i=0;i<n;i++){if(G.res.gold<50)break;let s=roll();if(hasTal('gacha')){G.pity=(G.pity||0)+1;if(s<3&&G.pity>=30)s=3;if(s>=3)G.pity=0}if(!s){G.res.gold-=50;if(Math.random()<ITEM_SHARE){const it=rndItem(iRoll());G.items.push(it);SM.push({it});continue}const b=ri(4,10),p=ri(3,8);G.res.wood+=b;G.res.stone+=p;const mo={};madd(mo,pick(BASEM),ri(1,3));if(Math.random()<.5)madd(mo,pick(BASEM.concat(['mat_cristal'])),1);if(Math.random()<.3){const x=Math.random();madd(mo,evoKey(pick(['parchemin','tome','pierre']),x<.8?1:x<.98?2:3),1)}giveM(mo);SM.push({m:[b,p],mo});continue}if(G.chars.length>=capa()){toast('L’auberge est pleine : améliorez-la pour accueillir plus de monde.');break}G.res.gold-=50;const c=mk(s);G.chars.push(c);SM.push({c})}save();syncNPC();rp()}
const pst=x=>x.c?x.c.st:x.it?x.it.st:1;
function pullHTML(){if(!SM.length)return'';return`<p class="m">Touchez une carte pour la retourner. Une lueur dorée annonce une rareté de 3★ ou plus.</p><div class="pull">${SM.map((x,i)=>`<div class="fl ${x.f?'on':''} ${pst(x)>=3&&!x.m?'hi':''}" style="animation-delay:${i*.06}s" onclick="flip(${i})"><div class="in"><div class="bk">✦</div><div class="fr r${pst(x)}">${x.c?`<img src="${cs(x.c).url}" alt=""><b>${x.c.name}</b>${stars(x.c.st)}<div style="font-size:11px">${ROLES[x.c.role].n} · ${ELEMS[x.c.elem].n}${x.c.race!='Humain'?' · '+x.c.race:''}${x.c.mage?'<br>Mage '+x.c.mage:''}</div>`:x.it?`<img src="${itemSrc(x.it)}" style="width:64px;height:64px;margin:12px 0 4px" alt=""><b>${iName(x.it)}</b>${stars(x.it.st)}<div style="font-size:11px">${SLOTS[ITYPES[x.it.t].s]}${ITYPES[x.it.t].role?' · '+ROLES[ITYPES[x.it.t].role].n:''}</div>`:`<img src="${scaleC(miscSprite('wood'),3).toDataURL()}" style="width:auto;height:36px;margin:12px 0 4px" alt=""><b>Ingrédients</b><div class="pmo">${Object.keys(x.mo||{}).map(k=>`<span title="${MATS[k].n}">${mIco(k)}×${x.mo[k]}</span>`).join('')}</div><div style="font-size:11px">+${x.m[0]} bois · +${x.m[1]} pierre</div>`}</div></div></div>`).join('')}</div><button class="alt" onclick="SM.forEach((x,i)=>setTimeout(()=>flip(i),i*200))">Tout révéler</button>`}
function flip(i){const x=SM[i];if(!x||x.f)return;x.f=1;const e=document.querySelectorAll('.fl')[i];if(!e)return;if(!x.m&&pst(x)>=3){e.classList.add('sh');setTimeout(()=>e.classList.add('on'),750)}else e.classList.add('on')}
