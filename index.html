  for(let i=F.bolts.length-1;i>=0;i--){const b=F.bolts[i];b.t-=dt;if(b.t<=0&&!b.h){b.h=1;spark(b.x,b.y-6,'#fff7a0',16,70);if(Math.hypot(p.x-b.x,p.y-b.y)<14)drain(.1,'Foudroyés !')}if(b.t<-.25)F.bolts.splice(i,1)}}}

function altar(k){const e=F.ents.find(e=>e.t=='altar'&&!e.used&&Math.hypot(F.p.x-e.x,F.p.y-e.y)<40);if(e)e.used=1;closePanel();const x=Math.random();if(!k){if(F.law=='gel')toast('Le froid étouffe la prière : rien ne se passe.');else{party().forEach(c=>{const m=stats(c).hp;F.hp[c.id]=Math.min(m,F.hp[c.id]+m*.2)});toast('Une chaleur douce vous enveloppe.')}}else if(x<.5)toast('L’orbe éclate en pièces d’or : '+addLoot({gold:120+15*F.f,shard:1}));else if(x<.75){const c=pick(party());c.inj=1;c.party=0;reidx();toast(c.name+' est gravement blessé par l’orbe !');if(!party().length)return leaveFloor('wipe');syncFol()}else toast('Rien ne se passe.');hud()}

 const lt=Object.keys(l).map(k=>`${l[k]} ${RES[k][0].toLowerCase()}`).join(', ');if(lt)lines.push('<p>Butin rapporté : '+lt+'.</p>');if(its.length)lines.push('<p>Objets trouvés (dans la réserve) : '+its.join(', ')+'.</p>');

function aiPick(u){if(B.zone==u&&B.zoneBy&&B.zoneBy.alive)return{t:'def'};const R=u.c.role,p=u.c.pers,hurtA=allies().some(a=>a.hp<a.mhp*(p=='Altruiste'?.7:.5));let sk=B.sp>=(p=='Impulsif'?1:2);if(R=='soigneur')sk=B.sp>0&&hurtA;if(R=='gardien')sk=B.sp>0&&u.sh<=0&&!u.taunt;
 const f=real();if(f.length){const wk=f.filter(e=>e.weak.includes(u.elem)&&!e.broken);B.tg=(p=='Calculateur'&&wk.length?wk:wk.length&&Math.random()<.6?wk:f).slice().sort((a,b)=>a.hp-b.hp)[0]}return{t:sk?'skill':'basic'}}
function hurt(t,d,o={}){if(t.guard)d*=.5;d=Math.max(1,Math.round(d));let r=d;if(t.sh>0){const ab=Math.min(t.sh,r);t.sh-=ab;r-=ab}t.hp=Math.max(0,t.hp-r);fl(t,String(d),o.crit?'crit':o.weak?'weak':'');t.flT=.12;B.shake=o.crit?4:2;const p=fpos(t);spark(p[0],p[1]+14,o.crit?'#ffcf4a':'#fff',o.crit?10:5,60);anim(160,k=>t.ox=(t.ally?-1:1)*4*Math.sin(k*3.14));
 if(t.ally)t.en=Math.min(100,t.en+8);if(t.mech&&t.mech.includes('metamorphose')&&!t.morphed&&!t.morphP&&t.hp>0&&t.hp<=t.mhp/2)t.morphP=1;
 if(t.hp<=0){t.alive=false;t.sh=0;if(t.ally){fl(t,'À TERRE','deb');say(t.n+' est à terre !')}else{anim(420,k=>t.fd=1-k);if(B.tg==t)B.tg=null;if(t.d&&t.d.ord)ordHit(t)}}}
function ordHit(t){if(t.d.ord==B.nextOrd){B.nextOrd++;say(t.n+' s’effondre.');if(B.nextOrd>3){say('Les pylônes sont tombés : le champion est vulnérable !');fl(t,'VULNÉRABLE','brk')}}else{say('Ordre rompu ! Les pylônes se relèvent.');flashT('ORDRE ROMPU');B.nextOrd=1;B.E.forEach(x=>{if(x.d.ord){x.alive=true;x.hp=x.mhp;x.fd=1}});const c=B.E.find(x=>x.d.qord&&x.alive);if(c){c.hp=Math.min(c.mhp,c.hp+c.mhp*.1)}}lawInfo()}

function deal(a,t,mult,tb,o={}){if(!t||!t.alive)return;const L=B.law,ae=[a.elem,a.el2].filter(Boolean),wk=!!(a.ally&&t.weak&&ae.some(e=>t.weak.includes(e))),fb=L=='prisme'&&ae.includes(B.field);

 const crit=Math.random()<(o.crit!=null?o.crit:a.crit);let d=atkOf(a)*mult*100/(100+t.def)*rnd(.95,1.05);if(crit)d*=1.5;if(t.broken)d*=1.2;if(fb)d*=1.5;if(L=='verrous'&&a.ally&&!ae.includes(B.rune))d*=.6;if(L=='orage'&&B.wx=='orage'&&ae.includes('foudre'))d*=1.3;if(!a.ally&&t.res&&t.res==a.elem)d*=.75;if(guarded(t)){d*=.2;fl(t,'PROTÉGÉ','buf')}

 else{const dx=t.x-dir*(14+(t.ally?0:t.spr.s.width/2-8))-u.x,dy=t.y-u.y;u.pose=0;await anim(190,k=>{u.ox=dx*k;u.oy=dy*k-Math.sin(k*3.14)*8});u.pose=1;await sleep(70);cb();await sleep(150);u.pose=0;await anim(200,k=>{u.ox=dx*(1-k);u.oy=dy*(1-k)})}u.pose=0;u.ox=0;u.oy=0}

 if(r=='guerrier')await hitAnim(u,t,()=>deal(u,t,2.2,20));
 else if(r=='assassin')await hitAnim(u,t,()=>deal(u,t,2.6,20,{crit:t.broken?1:u.crit+.2}));
 else if(r=='archer')for(let i=0;i<3;i++){const e=pick(real());if(!e)break;await hitAnim(u,e,()=>deal(u,e,.9,10),1)}
 else if(r=='sorcier'){await cast(u);await wave(u,E);foes().forEach(e=>deal(u,e,1.1,10));await sleep(260)}
 else if(r=='gardien'){await cast(u,'#bfe8ff');u.taunt=2;addSh(u,u.def*2+u.mhp*.1,u);await sleep(240)}
 else if(r=='soigneur'){await cast(u,'#5fe07a');const a=allies().sort((x,y)=>x.hp/x.mhp-y.hp/y.mhp)[0];heal(a,u.atk*1.6+a.mhp*.08,u);await sleep(240)}
 else{await cast(u,'#ffcf4a');const a=allies().filter(x=>x!=u).sort((x,y)=>y.atk-x.atk)[0]||u;a.bf.atk={v:.4,t:2};fl(a,'ATQ +40 %','buf');if(a!=u){a.av=0;fl(a,'AGIT !','buf')}await sleep(240)}B.skill=0}
async function cutIn(u){const R=kit(u.c),e=$('#cut');e.innerHTML=`<div class="band" style="--cc:${ELEMS[u.elem].c}"><img src="${u.spr.url}" alt=""><b>${R.ul[0]}<span>${u.n}</span></b></div>`;e.classList.add('go');await sleep(850);e.classList.remove('go')}

 if(r=='guerrier'&&t)await hitAnim(u,t,()=>{const f=foes(),i=f.indexOf(t);deal(u,t,J?2.8:3.2,30);[f[i-1],f[i+1]].forEach(e=>e&&deal(u,e,1.6,20));if(J)allies().forEach(a=>{a.bf.atk={v:.25,t:2};fl(a,'ATQ +25 %','buf')})});
 else if(r=='assassin'&&t){await hitAnim(u,t,()=>deal(u,t,4.5,30));if(!t.alive){if(B.cur==u)u.extra=1;else u.av=0;fl(u,'REJOUE','buf')}}
 else if(r=='archer'||r=='sorcier'){await cast(u);await wave(u,E);await wave(u,'#fff');foes().forEach(e=>deal(u,e,r=='archer'?1.8:2.4,20));await sleep(300)}
 else if(r=='gardien'){await cast(u,'#bfe8ff');allies().forEach(a=>addSh(a,u.def*1.4+u.mhp*.06,u));await sleep(260)}
 else if(r=='soigneur'){await cast(u,'#5fe07a');allies().forEach(a=>heal(a,u.atk*1.2+a.mhp*.06,u));await sleep(260)}
 else if(r=='soutien'){await cast(u,'#ffcf4a');allies().forEach(a=>{a.bf.atk={v:.3,t:2};fl(a,'ATQ +30 %','buf')});setSP(2);await sleep(260)}B.skill=0;drawTL()}
async function foeTurn(e){e.turns++;const M=e.mech;
 if(e.d.ord){say(e.n+' pulse d’une lueur menaçante');await sleep(300);return}
 if(e.type=='cristal'){const b=B.E.find(x=>x.alive&&x.mech.includes('cristaux'));if(b&&b.hp<b.mhp){say(e.n+' nourrit '+b.n);heal(b,b.mhp*.06)}await sleep(320);return}
 if(e.morphP){e.morphP=0;e.morphed=1;e.atk*=1.4;e.spd+=20;e.weak=newWeak(e.d,3);say(e.n+' change de forme !');B.shake=6;flashT('MÉTAMORPHOSE');const p=fpos(e);spark(p[0],p[1]+20,ELEMS[e.elem].c,30,90);await sleep(700);drawTI();return}
 if(e.charging){e.charging=0;say(e.n+' déchaîne sa charge !');await anim(200,k=>e.ox=-12*Math.sin(k*3.14));B.shake=7;allies().forEach(a=>deal(e,a,1.7,0));await sleep(320);return}

 if(B.zone&&B.zoneBy==e){const t=B.zone;B.zone=null;if(t.alive){say(e.n+' écrase le sol sous '+t.n+' !');B.shake=7;await anim(200,k=>e.ox=-12*Math.sin(k*3.14));deal(e,t,t.guard?1.6:2.4,0);await sleep(320);return}}
 if(M.includes('enrage')){e.atk*=1.1;fl(e,'RAGE +10 %','deb')}
 if(M.includes('zones')&&e.turns%3==1&&!B.zone){const t=pick(allies());if(t){B.zone=t;B.zoneBy=e;say(e.n+' fissure le sol sous '+t.n+' : mettez-le en Défense !');fl(t,'DANGER','deb');await sleep(650);return}}
 if(M.includes('serviteurs')&&!B.E.some(x=>x.alive&&x.kind=='minion')&&e.turns%4==1){say(e.n+' invoque des serviteurs !');for(let i=0;i<2;i++)addFoe({type:pick(F.bi.mon),elem:e.elem,kind:'minion'});await sleep(520);return}
 if(M.includes('charge')&&e.turns%3==0){e.charging=1;say(e.n+' concentre une attaque dévastatrice : brisez sa ténacité !');fl(e,'CHARGE…','deb');await sleep(650);drawTI();return}
 const al=allies();if(!al.length)return;const tn=al.find(a=>a.taunt>0);
 if(e.kind!='norm'&&e.kind!='minion'&&e.turns%3==2){say(e.n+' frappe toute l’équipe !');await anim(220,k=>e.ox=-14*Math.sin(k*3.14));B.shake=4;al.forEach(a=>deal(e,a,.7,0));if(B.ward)wardHit(e,.7);await sleep(260)}
 else if(B.ward&&!tn&&B.ward.hp>0&&Math.random()<.4){say(e.n+' s’en prend au cristal-phare !');await anim(220,k=>e.ox=-16*Math.sin(k*3.14));wardHit(e,1);await sleep(260)}
 else{const pool=[];al.forEach(a=>{pool.push(a);if(a.c.role=='gardien')pool.push(a)});const t=tn||pick(pool);say(e.n+' attaque '+t.n);await hitAnim(e,t,()=>deal(e,t,1,0),E0[e.type].rg)}}
function wardHit(e,m){const d=Math.max(1,Math.round(e.atk*m*rnd(.95,1.05)));B.ward.hp=Math.max(0,B.ward.hp-d);B.ward.fl=.12;floatT(LW*.14,B.gy+10,String(d),'');lawInfo()}
function updBattle(dt){if(B.ward&&B.ward.fl>0)B.ward.fl-=dt;B.A.forEach((u,i)=>{const e=$('#pc'+i);if(!e)return;const hp=e.children[3],en=e.children[4];hp.firstChild.style.width=u.hp/u.mhp*100+'%';hp.lastChild.style.width=Math.min(100,u.sh/u.mhp*100)+'%';hp.classList.toggle('low',u.hp<u.mhp*.3);en.firstChild.style.width=u.en+'%';e.classList.toggle('cur',B.cur==u);e.classList.toggle('dn',!u.alive);e.classList.toggle('rdy',u.alive&&u.en>=100);e.classList.toggle('dg',u.alive&&u.hp<u.mhp*.25);e.children[2].textContent=u.alive&&u.hp<u.mhp*.25?'DANGER':u.n});
 B.A.concat(B.E).forEach(u=>{if(u.flT>0)u.flT-=dt});if(B.shake>0)B.shake=Math.max(0,B.shake-dt*18)}
function drawBattle(){const sx=B.shake?Math.round(rnd(-B.shake,B.shake)):0,sy=B.shake?Math.round(rnd(-B.shake,B.shake)*.5):0;X.save();X.translate(sx,sy);X.drawImage(B.bg,0,0);
 const L=B.A.concat(B.E).filter(u=>u.alive||u.ally||u.fd>0).sort((a,b)=>a.y+a.oy-b.y-b.oy);
 for(const u of L){const x=u.x+u.ox,y=u.y+u.oy;
  if(u.ally){const s=u.spr;if(!u.alive){X.save();X.globalAlpha=.6;X.translate(Math.round(x),Math.round(y));X.rotate(-Math.PI/2);X.drawImage(s.idle[0],-4,-16);X.restore();continue}shadow(x,y,7);if(B.cur==u){X.fillStyle='#ffcf4a';const a=Math.round(x),b=Math.round(y-36+Math.sin(T*6)*2);X.fillRect(a-3,b,6,2);X.fillRect(a-2,b+2,4,2);X.fillRect(a-1,b+4,2,2)}
   dS(u.flT>0?s.white:u.pose?s.atk:s.idle[Math.floor(T*2+u.ph)%2],x,y,false);if(u.sh>0){X.fillStyle='rgba(191,232,255,.35)';X.fillRect(Math.round(x-11),Math.round(y-30),22,31);X.fillStyle='#bfe8ff';X.fillRect(Math.round(x-11),Math.round(y-30),22,1);X.fillRect(Math.round(x-11),Math.round(y),22,1)}if(u.taunt>0){X.fillStyle='#ff5a5a';X.fillRect(Math.round(x-1),Math.round(y-40),2,4);X.fillRect(Math.round(x-1),Math.round(y-35),2,2)}
   X.fillStyle='#000';X.fillRect(Math.round(x-9),Math.round(y+3),18,3);X.fillStyle=u.hp<u.mhp*.3?'#ff5a5a':'#5fe07a';X.fillRect(Math.round(x-8),Math.round(y+4),Math.round(16*u.hp/u.mhp),1)}
  else{const s=u.spr,h=s.s.height,bob=Math.round(Math.abs(Math.sin(T*3+u.ph))*2);shadow(x,y,Math.min(18,s.s.width/2-2));const img=u.flT>0?s.white:B.tg==u&&u.alive?s.glow:s.s;dS(img,x,y-bob+(img==s.glow?1:0),true,u.alive?(u.broken?.7:1):u.fd);if(!u.alive)continue;
   const bx=Math.round(x-12),by=Math.round(y-h-9-bob);X.fillStyle='#000';X.fillRect(bx-1,by-1,26,u.mt?6:4);X.fillStyle='#ff5a5a';X.fillRect(bx,by,Math.round(24*u.hp/u.mhp),2);if(u.mt){X.fillStyle=u.broken?'#6a6478':'#fff';X.fillRect(bx,by+3,Math.round(24*u.tough/u.mt),1)}
   u.weak.forEach((w,i)=>{X.fillStyle='#000';X.fillRect(bx+i*6-1,by-7,5,5);X.fillStyle=ELEMS[w].c;X.fillRect(bx+i*6,by-6,3,3)});
   if(B.tg==u){X.fillStyle='#ffcf4a';const a=Math.round(x),b=by-14+Math.round(Math.sin(T*6)*2);X.fillRect(a-3,b,6,2);X.fillRect(a-2,b+2,4,2);X.fillRect(a-1,b+4,2,2)}if(u.charging&&Math.floor(T*8)%2){X.fillStyle='#ff5a5a';X.fillRect(Math.round(x-1),by-24,3,7);X.fillRect(Math.round(x-1),by-15,3,2)}if(u.broken){X.fillStyle='#ffcf4a';for(let i=0;i<3;i++){const an=T*4+i*2.1;X.fillRect(Math.round(x+Math.cos(an)*9),Math.round(y-h-2+Math.sin(an)*3),2,2)}}}}
 if(B.ward){const s=obSprite('crystal','#4de0c0'),x=Math.round(LW*.14),y=Math.round(B.gy+(LH*(VWp>VHp?.3:.27))*.55);shadow(x,y,8);dS(B.ward.fl>0?tintC(s,'#fff'):s,x,y+2,false,B.ward.hp>0?1:.3);X.fillStyle='#000';X.fillRect(x-10,y+5,20,3);X.fillStyle='#4de0c0';X.fillRect(x-9,y+6,Math.round(18*B.ward.hp/B.ward.mhp),1)}
 if(B.zone&&B.zone.alive&&Math.floor(T*6)%2){const x=Math.round(B.zone.x+B.zone.ox),y=Math.round(B.zone.y+B.zone.oy);X.fillStyle='#ff5a5a';X.fillRect(x-12,y+1,24,1);X.fillRect(x-10,y+3,20,1);X.fillRect(x-12,y-1,2,4);X.fillRect(x+10,y-1,2,4)}
 if(B.proj){X.fillStyle='#fff';X.fillRect(Math.round(B.proj.x)-2,Math.round(B.proj.y)-2,4,4);X.fillStyle=B.proj.c;X.fillRect(Math.round(B.proj.x)-1,Math.round(B.proj.y)-3,2,6);X.fillRect(Math.round(B.proj.x)-3,Math.round(B.proj.y)-1,6,2)}X.restore()}

 if(vig)X.drawImage(vig,0,0);updLabs();if(mode!='battle')setActs();hudT+=dt;if(hudT>.3){hudT=0;if(mode=='floor'&&F){drawMini();objective()}else if(mode=='village')objective()}}
